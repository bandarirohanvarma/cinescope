name: cinescope

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: cinescope
      POSTGRES_PASSWORD: cinescope
      POSTGRES_DB: cinescope
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinescope -d cinescope"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
